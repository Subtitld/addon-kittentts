name: Diagnose ARM builds (temporary)

on:
  workflow_dispatch:

jobs:
  arm:
    name: macOS ${{ matrix.name }}
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: release-flags, threads: auto }
          - { name: release-flags-3-threads, threads: '3' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build
        shell: bash
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          sysctl -a | grep -E 'machdep.cpu.brand|hw.optional.arm' || true
          python tools/build_native.py
      - name: One line, two seeds
        shell: bash
        env:
          SUBTITLD_MODELS_DIR: ${{ runner.temp }}/models
        run: |
          python - <<'PY'
          import json, subprocess, time
          from pathlib import Path
          from kittentts_addon import download, engine
          download.ensure(engine.base_pins(), engine.pins()['repo'], engine.revision(), lambda *a: None, lambda: False)
          engine._write_run_files(engine.builtin_voice_file('Bruno'), None)
          import os
          threads = engine.default_threads() if '${{ matrix.threads }}' == 'auto' else 3
          print('performance_cores', engine.performance_cores(), 'cpu_count', os.cpu_count(), 'threads', threads)
          text = ('Look, we have to follow our passions. You have your robotics, '
                  'and I just want to be awesome in space, by the 3rd of May.')
          for seed in (3, 7922):
              report = Path(f'report-{seed}.json')
              cmd = [str(engine.binary_path()), '--assets', str(engine.revision_root()), '--offline',
                     '--data', str(engine.text_data_dir()), '--voice', engine.VOICE_NAME,
                     '--text', text, '--output', f'out-{seed}.wav',
                     '--report', str(report), '--threads', str(threads), '--seed', str(seed),
                     '--max-tokens', str(engine.max_tokens(text))]
              t = time.monotonic()
              p = subprocess.run(cmd, capture_output=True, text=True)
              tail = [l for l in p.stderr.splitlines() if not l.startswith(('llama_', 'load', 'print_info', 'create_tensor', 'graph_reserve', 'resolve_fused', 'sched_', 'set_', 'done_getting', '.'))][-8:]
              print('seed', seed, 'rc', p.returncode, f'{time.monotonic() - t:.0f}s', engine.summary(report), tail, flush=True)
              if report.is_file():
                  c = json.loads(report.read_text())['chunks'][0]
                  print('  first audio tokens', c['audio_tokens'][:20], 'last', c['audio_tokens'][-10:])
          PY
